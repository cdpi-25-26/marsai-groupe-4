app = 'marsai-api'
primary_region = 'cdg'

[build]

[deploy]
  release_command = "node_modules/.bin/sequelize db:migrate"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
